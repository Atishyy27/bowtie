name: filter-dialects-check
on:
  push:
    branches: [ci-1332]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group=test
      - name: filter-dialects tests (new and existing)
        run: uv run pytest bowtie/tests/test_integration.py -k "filter_dialects" -p no:cacheprovider -q
      - name: lint the changed file
        run: uvx ruff check bowtie/_cli.py bowtie/tests/test_integration.py
